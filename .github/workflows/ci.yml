name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Requerido para que los checks corran en la merge queue de GitHub.
  merge_group:

# Cancela corridas viejas de la misma rama/PR para no malgastar minutos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principio de menor privilegio: este workflow solo necesita leer el repo.
# Nunca uses pull_request_target con código de forks.
permissions:
  contents: read

# Varlock valida los .env.schema durante el install y el build del frontend,
# así que necesita estos valores presentes (no son secretos reales).
env:
  NODE_ENV: test
  BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
  BETTER_AUTH_URL: http://localhost:3000
  CORS_ORIGIN: http://localhost:3001
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/plata
  VITE_SERVER_URL: http://localhost:3000
  EXPO_PUBLIC_SERVER_URL: http://localhost:3000

jobs:
  quality:
    name: Lint, tipos y tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Las actions van pineadas a SHA (no a tags movibles) para mitigar
      # supply-chain attacks. Dependabot las mantiene actualizadas.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Cache de Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Lint y formato
        run: bun run check

      - name: Tipos
        run: bun run check-types

      - name: Tests unitarios
        run: bun run test
