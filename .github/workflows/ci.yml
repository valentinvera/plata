name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Required so checks run on GitHub's merge queue.
  merge_group:

# Cancel old runs from the same branch/PR to avoid wasting minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only needs to read the repo.
# Never use pull_request_target with fork code.
permissions:
  contents: read

# Varlock validates the .env.schema during install and the frontend build,
# so these values must be present (they are not real secrets).
env:
  NODE_ENV: test
  BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
  BETTER_AUTH_URL: http://localhost:3000
  CORS_ORIGIN: http://localhost:3001
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/plata
  VITE_SERVER_URL: http://localhost:3000
  EXPO_PUBLIC_SERVER_URL: http://localhost:3000

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to SHAs (not movable tags) to mitigate
      # supply-chain attacks. Dependabot keeps them updated.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format
        run: bun run check

      - name: Types
        run: bun run check-types

      - name: Unit tests
        run: bun run test
